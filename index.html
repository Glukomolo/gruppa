<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тудушник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Тудушник</h1>

  <form id="add-form">
    <input type="text" id="new-todo" placeholder="Что нужно сделать?" required>
    <input type="number" id="user-id" placeholder="userId" min="1" value="1">
    <button type="submit">Добавить</button>
  </form>

  <div class="status" id="status"></div>

  <h2 id="list-title">Список задач (<span id="count">0</span>)</h2>
  <ul id="list"></ul>

  <dialog id="task-modal">
    <form id="edit-form">
      <h2>Редактирование задачи</h2>
      <input type="text" id="edit-text" placeholder="Что нужно сделать?" required>
      <label class="field-row">
        userId
        <input type="number" id="edit-user-id" placeholder="userId" min="1" required>
      </label>
      <label class="done-row">
        <input type="checkbox" id="edit-done"> Выполнено
      </label>
      <div class="modal-actions">
        <button type="button" id="edit-cancel" class="secondary">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-modal">
    <h2>Удалить задачу?</h2>
    <p id="delete-text"></p>
    <div class="modal-actions">
      <button type="button" id="delete-cancel" class="secondary">Отмена</button>
      <button type="button" id="delete-confirm" class="danger">Удалить</button>
    </div>
  </dialog>

  <script src="scrip.js"></script>
</body>
</html>
