<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тудушник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Тудушник</h1>

  <button type="button" id="open-add">Добавить задачу</button>

  <div class="status" id="status"></div>

  <h2 id="list-title">Список задач (<span id="count">0</span>)</h2>
  <label class="todo-filter" for="todo-filter">
    Показать задачи
    <select id="todo-filter">
      <option value="all">Все</option>
      <option value="done">Выполненные</option>
      <option value="active">Невыполненные</option>
    </select>
    Сортировка
    <select id="todo-sort">
      <option value="default">По умолчанию</option>
      <option value="asc">От А до Я</option>
      <option value="desc">От Я до А</option>
    </select>
  </label>
  <ul id="list"></ul>

  <dialog id="add-modal">
    <form id="add-form">
      <h2>Новая задача</h2>
      <input type="text" id="new-todo" placeholder="Что нужно сделать?" required>
      <label class="field-row">
        userId
        <input type="number" id="user-id" placeholder="userId" min="1" value="1" required>
      </label>
      <div class="status" id="add-status"></div>
      <div class="modal-actions">
        <button type="button" id="add-cancel" class="secondary">Отмена</button>
        <button type="submit">Добавить</button>
      </div>
    </form>
  </dialog>

<dialog id="task-modal" class="task-info-modal">
    <div class="modal-header">
      <h2>Просмотр задачи</h2>
      <button type="button" id="task-close-x" class="modal-close-btn" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body">
      <p id="task-info-text" class="task-info-text"></p>
      <p class="task-user-row">Пользователь: <button type="button" id="task-user"></button></p>
    </div>
  </dialog>

  <dialog id="edit-modal">
    <form id="edit-form">
      <h2>Изменить задачу</h2>
      <input type="text" id="edit-text" required>
      <label class="field-row">
        userId
        <input type="number" id="edit-user-id" placeholder="userId" min="1" required>
      </label>
      <label class="done-row">
        <input type="checkbox" id="edit-done">
        Выполнено
      </label>
      <div class="status" id="edit-status"></div>
      <div class="modal-actions">
        <button type="button" id="edit-cancel" class="secondary">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-modal">
    <h2>Удалить задачу?</h2>
    <p id="delete-text"></p>
    <div class="modal-actions">
      <button type="button" id="delete-cancel" class="secondary">Отмена</button>
      <button type="button" id="delete-confirm" class="danger">Удалить</button>
    </div>
  </dialog>

 <dialog id="user-modal" class="user-dialog">
    <div class="user-layout">

      <section class="user-tasks" aria-labelledby="ut-title">
        <h2 id="ut-title">Задачи пользователя</h2>
        <p id="ut-subtitle" class="ut-subtitle"></p>

        <form id="ut-add-form" class="ut-add">
          <input type="text" id="ut-new" placeholder="Новая задача" required>
          <button type="submit">Добавить</button>
        </form>

        <div class="ut-filters" role="group" aria-label="Фильтр задач">
          <button type="button" class="ut-filter active" data-filter="all" aria-pressed="true">Все <span>0</span></button>
          <button type="button" class="ut-filter" data-filter="active" aria-pressed="false">В работе <span>0</span></button>
          <button type="button" class="ut-filter" data-filter="done" aria-pressed="false">Готовые <span>0</span></button>
          <select id="ut-sort" class="ut-sort-select">
            <option value="default">По умолчанию</option>
            <option value="asc">От А до Я</option>
            <option value="desc">От Я до А</option>
          </select>
        </div>

        <div class="ut-status" id="ut-status"></div>
        <ul id="ut-list"></ul>
      </section>

      <section class="user-card" aria-labelledby="user-card-title">
        <div class="user-card-header">
          <h2 id="user-card-title">Профиль пользователя</h2>
          <button type="button" id="user-close" aria-label="Закрыть">×</button>
        </div>

        <img id="user-photo" class="user-photo" alt="Аватар пользователя">
        <h3 id="user-name"></h3>
        <p id="user-username" class="user-username"></p>
        <p id="user-id-label" class="user-id-label"></p>

        <dl class="user-details">
          <div><dt>Возраст</dt><dd id="user-age"></dd></div>
          <div><dt>Email</dt><dd id="user-email"></dd></div>
          <div><dt>Телефон</dt><dd id="user-phone"></dd></div>
          <div><dt>Город</dt><dd id="user-city"></dd></div>
          <div><dt>Компания</dt><dd id="user-company"></dd></div>
          <div><dt>Должность</dt><dd id="user-job"></dd></div>
        </dl>
      </section>

    </div>
  </dialog>

  <script src="scrip.js"></script>
</body>
</html>
